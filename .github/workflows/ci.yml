name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest tests/ -v

      - name: Import smoke test
        run: |
          python -c "import dfuconfig; print('dfuconfig OK')"
          python -c "from utils.logging_config import get_logger; print('logging_config OK')"
          python -c "import web_server; print('web_server OK (chromadb optional, degraded)')"
          python -c "import knowledge; print('knowledge OK, VECTOR_STORE_AVAILABLE =', knowledge.VECTOR_STORE_AVAILABLE)"

      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock || echo "::warning::pip-audit found vulnerabilities in requirements.lock"
