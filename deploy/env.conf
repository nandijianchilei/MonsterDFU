# DFU 环境变量配置模板
# 部署到 /etc/dfu/env.conf 后，systemd 服务启动时自动加载。

# ── LLM 认证（必填）──
DFU_LLM__API_KEY=your-api-key-here

# ── Web API 认证 Token（生产环境必填）──
DFU_WEB_API_TOKEN=your-random-token-here

# ── 外部服务连接 ──
# RABBITMQ_URL=amqp://dfu:dfu_secret@rabbitmq:5672/
# ETCD_URL=http://etcd:2379
# REDIS_URL=redis://redis:6379/0
# PG_HOST=postgres
# PG_DATABASE=dfu
# PG_USER=dfu
# PG_PASSWORD=dfu_pg_secret
